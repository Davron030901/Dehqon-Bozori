name: CI

# Four jobs, because the parts fail for different reasons and a broken
# stylesheet should not hide a broken query — or a broken phone screen.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python — all six suites
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          # test_frontend.py shells out to `node --check`; without node it
          # skips those checks instead of running them, which is worse than
          # failing because it looks green.
          node-version: '20'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Import check
        # Catches a broken import before the suites spend time on a database.
        working-directory: backend
        run: python -c "import app.main, app.api.app, app.bot.handlers; print('imports ok')"

      - name: All suites
        # backend · contract · bot · frontend · security · mobile
        # Throwaway SQLite databases; no real secrets anywhere.
        env:
          BOT_TOKEN: '0:test'
          BOT_USERNAME: DehqonBozoriTestBot
          ADMIN_IDS: '777'
        run: python test_all.py

  postgres:
    name: Backend on Postgres — what production runs
    # SQLite forgives what Postgres does not: an aborted transaction that turns
    # COMMIT into ROLLBACK, a 32-bit id overflow, a column schema.sql forgot.
    # Each of those once passed every SQLite suite above.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: pw
      BOT_TOKEN: '0:test'
      BOT_USERNAME: DehqonBozoriTestBot
      ADMIN_IDS: '777'
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          # The upgrade check below reads the first commit's schema.sql.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Platform suite on Postgres
        run: |
          psql -c "create database platform"
          TEST_DATABASE_URL=postgresql+asyncpg://postgres:pw@localhost:5432/platform \
            python test_platform.py

      - name: schema.sql matches the models, and the backend starts on it
        run: |
          psql -c "create database from_schema"
          # Supabase has this role; a plain Postgres does not.
          psql -c "create role anon"
          psql -d from_schema -v ON_ERROR_STOP=1 -f supabase/schema.sql
          DATABASE_URL=postgresql+asyncpg://postgres:pw@localhost:5432/from_schema \
            python check_schema_sql.py

      - name: Migrations upgrade a database made from the first schema
        # A live Supabase made from the original schema.sql, brought up to date
        # by the numbered migrations, must end up where schema.sql is now.
        # Every migration runs twice: each one must be safe to re-run.
        run: |
          psql -c "create database upgraded"
          git show 50a4404:backend/supabase/schema.sql | psql -d upgraded -v ON_ERROR_STOP=1
          for f in supabase/migrations/000[2-9]_*.sql; do
            psql -d upgraded -v ON_ERROR_STOP=1 -f "$f"
            psql -d upgraded -v ON_ERROR_STOP=1 -f "$f"
          done
          DATABASE_URL=postgresql+asyncpg://postgres:pw@localhost:5432/upgraded \
            python check_schema_sql.py

  frontend:
    name: Frontend — verify, types, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # `npm ci` needs a lockfile; fall back so the first push works before
        # package-lock.json has been committed.
        run: npm ci || npm install

      - name: Architecture rules
        # Reads backend/app/catalog.py too, so category and region slugs cannot
        # drift apart between the two halves of the project.
        run: npm run verify

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        # The real Vercel gate. Without NEXT_PUBLIC_API_URL the site builds
        # against demo data, which is what a preview deploy does.
        run: npm run build

  mobile:
    name: Mobile — verify, types, lint, test, Android bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # React Native 0.86 needs Node 20.19+ / 22.13+.
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Architecture rules
        # Reads backend/app/catalog.py and districts.py, so the app's
        # categories, labels (uz + ru) and districts cannot drift from the bot's.
        run: npm run verify

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Android bundle
        # The real compile: Metro resolves every screen and import and emits
        # Hermes bytecode. An empty API URL builds the demo-data variant.
        env:
          CI: '1'
        run: npx expo export --platform android --output-dir dist
